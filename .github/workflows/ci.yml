name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One definition of "valid": CI runs the same script a developer runs.
      # These two steps used to be copy-pasted duplicates of validate.sh's
      # frontmatter and symlink loops, and CI never invoked the script at all —
      # so a check added to it would not have run here. (The frontmatter copy
      # carried the same dead `sed` extraction, and could never fail.)
      # validate.sh skips its own npx markdownlint when $CI is set, so the
      # pinned action below stays the only markdown lint in CI.
      # validate.sh also runs the tune-safety validator and its self-test, and
      # the description gate and its self-test, so they are not repeated as
      # steps here — each would otherwise execute twice. It echoes a `=== … ===`
      # heading per section, so a failure still names the gate that caught it.
      - name: Validate skills
        run: ./scripts/validate.sh

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: "skills/**/*.md"
          config: ".markdownlint.json"
